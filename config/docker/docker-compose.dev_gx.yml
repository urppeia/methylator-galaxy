version: '3.8'

services:
  galaxy:
    build:
      context: .
      dockerfile: Dockerfile.dev_gx
    image: methylator-galaxy:dev_gx
    container_name: methylator-galaxy-dev_gx
    ports:
      - "8081:80"
    volumes:
      - galaxy_data:/export/
    environment:
      - GALAXY_CONFIG_BRAND=Galaxy 26.1 (vanilla)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  galaxy_data: