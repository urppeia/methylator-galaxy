version: '3.8'

services:
  galaxy:
    build:
      context: ../..
      dockerfile: config/docker/Dockerfile
      # Use BuildKit for faster builds and better caching
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: methylator-galaxy:latest
    container_name: methylator-galaxy
    ports:
      - "8080:80"
      - "8888:8888"  # MCP Server port for agents
    environment:
      GALAXY_CONFIG_BRAND: ${GALAXY_CONFIG_BRAND:-Methylator}
      GALAXY_ADMIN_USER: ${GALAXY_ADMIN_USER:-admin}
      GALAXY_ADMIN_PASSWORD: ${GALAXY_ADMIN_PASSWORD:-password}
      GALAXY_ADMIN_API_KEY: ${GALAXY_ADMIN_API_KEY:-fakekey}
      # Reduced startup timeout from 600s to 120s for faster feedback
      GALAXY_STARTUP_WAIT: ${GALAXY_STARTUP_WAIT:-120}
      GALAXY_LOG_LEVEL: ${GALAXY_LOG_LEVEL:-INFO}
      # Performance tuning
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      # Enable Galaxy Agents support
      GALAXY_ENABLE_AGENTS: "true"
      # Auto-migrate database schema on startup
      GALAXY_AUTO_UPDATE_DB: "true"
      # Create default admin user on startup
      GALAXY_DEFAULT_ADMIN_USER: "admin"
      GALAXY_DEFAULT_ADMIN_EMAIL: "admin@example.org"
      GALAXY_DEFAULT_ADMIN_PASSWORD: ${GALAXY_ADMIN_PASSWORD:-password}
      GALAXY_DEFAULT_ADMIN_KEY: ${GALAXY_ADMIN_API_KEY:-fakekey}
      # Use local task runner instead of Celery to avoid RabbitMQ dependency
      GALAXY_CELERY_BROKER: "memory://"
      GALAXY_CELERY_BACKEND: "cache+memory://"
      # Use SQLite database (simpler, like Preprint version)
      GALAXY_DATABASE_CONNECTION: "sqlite:////export/galaxy/universe.sqlite?isolation_level=IMMEDIATE"
      # Disable internal PostgreSQL, RabbitMQ, and Celery (SQLite compatible)
      NONUSE: "postgres,rabbitmq,celery"
      # Disable job handlers to avoid SQLite locking with multiple processes
      GALAXY_HANDLER_NUMPROCS: "0"
    volumes:
      # Persist Galaxy data
      - galaxy-data:/export/galaxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    # Reduce wait time for container startup
    stop_grace_period: 30s

volumes:
  galaxy-data:

# Usage:
# Development build with BuildKit:
#   DOCKER_BUILDKIT=1 docker-compose build --progress=plain
#
# Start container:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f galaxy
#
# Stop container:
#   docker-compose down
#
# View installed tools:
#   docker-compose exec galaxy galaxy-http-get http://localhost/api/tools
