name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "20*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: dktanwar
        password: ${{ secrets.DOCKER_METHYLATOR }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./config/docker/Dockerfile
        push: true
        tags: dktanwar/methylator-galaxy:latest,${{ github.ref_type == 'tag' && format('dktanwar/methylator-galaxy:{0}', github.ref_name) || '' }}
